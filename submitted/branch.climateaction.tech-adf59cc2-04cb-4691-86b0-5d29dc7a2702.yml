
---
name: The branch.climateaction.tech Website Test
author: Unknown
description: Opens the branch.climateaction.tech page, waits for full load

sci:
  R_d: Website load

services:
  gcb-playwright-warmup:
    image: greencoding/gcb_playwright:v16
  gcb-playwright-run:
    image: greencoding/gcb_playwright:v16

  squid:
    image: greencoding/squid_reverse_proxy:v1
    ports:
      - 3128:3128

flow:

  - name: Named pipe (warmup)
    container: gcb-playwright-warmup
    commands:
      - type: console
        command: mkfifo /tmp/my_fifo_warmup

  - name: Named pipe (run)
    container: gcb-playwright-run
    commands:
      - type: console
        command: mkfifo /tmp/my_fifo_run

  - name: Startup (warmup)
    container: gcb-playwright-warmup
    commands:
      - type: console
        detach: true
        command: python3 /tmp/repo/visit.py --fifo-path /tmp/my_fifo_warmup
        read-notes-stdout: true
        log-stdout: true
        log-stderr: true

  - name: Startup (run)
    container: gcb-playwright-run
    commands:
      - type: console
        detach: true
        command: python3 /tmp/repo/visit.py --fifo-path /tmp/my_fifo_run
        read-notes-stdout: true
        log-stdout: true
        log-stderr: true


  - name: Pause (both)
    container: gcb-playwright-warmup
    commands:
      - type: console
        command: sleep 2
        read-notes-stdout: true
        log-stdout: true
        log-stderr: true

  - name: Warmup branch.climateaction.tech_issues_issue-3_we-need-a-fossil-free-internet-by-2030_ (max. 5 s)
    container: gcb-playwright-warmup
    commands:
      - type: console
        shell: bash
        command: echo "https://branch.climateaction.tech/issues/issue-3/we-need-a-fossil-free-internet-by-2030/" > /tmp/my_fifo_warmup && sleep 5
        read-notes-stdout: true
        log-stdout: true
        log-stderr: true

  - name: Go to and idle branch.climateaction.tech_issues_issue-3_we-need-a-fossil-free-internet-by-2030_ (max. 5 s)
    container: gcb-playwright-run
    commands:
      - type: console
        shell: bash
        command: echo "https://branch.climateaction.tech/issues/issue-3/we-need-a-fossil-free-internet-by-2030/" > /tmp/my_fifo_run && sleep 5
        read-notes-stdout: true
        log-stdout: true
        log-stderr: true

  - name: Dump Log
    container: squid
    commands:
      - type: console
        command: cat /apps/squid/var/logs/access.log
        read-notes-stdout: true
        log-stdout: true
        log-stderr: true
